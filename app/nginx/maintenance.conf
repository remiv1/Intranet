error_page 418 =503 $planned_page;
error_page 502 503 504 =503 $outage_page;

location = /_maintenance/favicone.svg {
    alias /usr/share/nginx/favicone.svg;
}

location = /_maintenance/status.css {
    root /usr/share/nginx;
}

location ~ ^/_maintenance/(outage|planned)\.html$ {
    internal;
    root /usr/share/nginx;
}

location = /_maintenance/outage.json {
    internal;
    default_type application/json;
    return 503 '{"error":"intranet_unavailable","message":"Intranet temporairement indisponible.","contact":"rverschuur@audit-io.fr"}';
}

location = /_maintenance/planned.json {
    internal;
    default_type application/json;
    return 503 '{"error":"intranet_maintenance","message":"Maintenance en cours.","contact":"rverschuur@audit-io.fr"}';
}