events {

}
http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=30s ipv6=off;

    map "$http_accept|$http_content_type" $maintenance_json {
        default 0;
        "~*application/(?:[a-z0-9.+-]+\+)?json(?:\s|;|,|\||$)" 1;
    }
    map $maintenance_json $outage_page {
        default /_maintenance/outage.html;
        1 /_maintenance/outage.json;
    }
    map $maintenance_json $planned_page {
        default /_maintenance/planned.html;
        1 /_maintenance/planned.json;
    }
    map $status $maintenance_cache {
        default "";
        503 "no-store";
    }

    server {
        listen 443 ssl;
        server_name intra.laperaudiere.com;

        ssl_certificate     /etc/nginx/certs/intraraudiere.crt;
        ssl_certificate_key /etc/nginx/certs/intraraudiere.key;

        # 🔐 Headers de sécurité
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header Permissions-Policy "geolocation=(), microphone=()";
        add_header Cache-Control $maintenance_cache always;

        include /etc/nginx/maintenance.conf;

        client_max_body_size 20M;

        location / {
            if (-f /usr/share/nginx/_maintenance/maintenance.enabled) {
                return 418;
            }
            proxy_intercept_errors on;
            set $web_upstream http://web:5000;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    server {
    listen 80;
    server_name intra.laperaudiere.com;

    add_header Cache-Control $maintenance_cache always;
    include /etc/nginx/maintenance.conf;

    # 🔁 Redirection vers HTTPS
    location / {
        if (-f /usr/share/nginx/_maintenance/maintenance.enabled) {
            return 418;
        }
        return 301 https://$host$request_uri;
    }
    }
}